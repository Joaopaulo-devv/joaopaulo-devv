name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 3 * * *"   # Todo dia às 03:00 UTC
  workflow_dispatch:        # Permite rodar manualmente na aba "Actions"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Duas variantes para o README funcionar nos temas claro e escuro
      - name: Gerar streak (tema escuro)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0D1117&disable_animations=true
          path: profile/streak.svg
          token: ${ secrets.GITHUB_TOKEN }}

      - name: Gerar streak (tema claro)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${ github.repository_owner }}&theme=default&hide_border=true&background=FFFFFF&disable_animations=true
          path: profile/streak-light.svg
          token: ${ secrets.GITHUB_TOKEN }}

      - name: Commitar cards atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualizar cards do perfil" || exit 0
          git push
